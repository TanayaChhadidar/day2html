<!DOCTYPE html>
<html>
<head>
<style>
.product {
    position: relative;
    display: inline-block;
    padding-bottom: 50px;
}

.product img {
    width: 300px;
    height: 300px;
    object-fit: cover;
}

.discount {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: black;
    color: white;
    padding: 8px;
}

.cart {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 15px;
    background-color: white;
    border: 1px solid gray;
}
</style>
</head>

<body>

<div class="product">

    <img src="shirt.jpg">

    <div class="discount">
        20% OFF
    </div>

    <button class="cart">
        Add to Cart
    </button>

</div>

</body>
</html>
