<!DOCTYPE html>
<html>
<head>
<style>
.product {
    position: relative;
    display: inline-block;
}

.product img {
    width: 300px;
    height: 300px;
    object-fit: cover;
}

.discount {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: black;
    color: white;
    padding: 8px;
}
</style>
</head>

<body>

<div class="product">

    <img src="shirt.jpg">

    <div class="discount">
        20% OFF
    </div>

</div>

</body>
</html>
