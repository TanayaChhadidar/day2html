<!DOCTYPE html>
<html>
<head>
<style>
body {
    height: 3000px;
}

.video {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    height: 180px;
    background-color: gray;
}

.close {
    position: absolute;
    top: -15px;
    left: -15px;
    background-color: black;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    text-align: center;
    line-height: 30px;
}

.time {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background-color: black;
    color: white;
    padding: 3px;
}
</style>
</head>

<body>

<div class="video">

    <div class="close">X</div>

    <div class="time">0:29</div>

</div>

</body>
</html>
