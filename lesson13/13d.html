<!DOCTYPE html>
<html>
<head>
<style>
.email {
    width: 400px;
    border: 1px solid #ddd;
    padding: 15px;
}

.title {
    color: gray;
    font-size: 12px;
    margin-bottom: 15px;
}

.message {
    display: flex;
    align-items: center;
}

.profile {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    margin-right: 10px;
}

.content {
    flex: 1;
}

.sender {
    font-weight: bold;
}

.subject {
    font-weight: bold;
}

.preview {
    color: gray;
}

.time {
    font-size: 12px;
    color: gray;
    align-self: flex-start;
}
</style>
</head>

<body>

<div class="email">

    <div class="title">ALL INBOXES</div>

    <div class="message">

        <img class="profile" src="cat.jpg">

        <div class="content">
            <div class="sender">Chewy Promotions</div>
            <div class="subject">Biggest sales of the year!</div>
            <div class="preview">
                Hey there! We're writing to tell you about our...
            </div>
        </div>

        <div class="time">4:58 PM</div>

    </div>

</div>

</body>
</html>
