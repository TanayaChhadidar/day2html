<!DOCTYPE html>
<html>
<head>
<style>
.tweet {
    width: 500px;
    border: 1px solid #ddd;
    padding: 15px;
}

.top {
    display: flex;
}

.profile {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    margin-right: 10px;
}

.content {
    flex: 1;
}

.username {
    font-weight: bold;
}

.handle {
    color: gray;
}

.text {
    margin-top: 5px;
}

.link {
    margin-top: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
}

.thumbnail {
    width: 100px;
    height: 100px;
    background-color: lightgray;
}

.link-info {
    padding: 15px;
}

.website {
    color: gray;
}

.title {
    font-weight: bold;
}
</style>
</head>

<body>

<div class="tweet">

    <div class="top">

        <img class="profile" src="cat.jpg">

        <div class="content">

            <div>
                <span class="username">supersimple.dev</span>
                <span class="handle">@SuperSimpleDev</span>
            </div>

            <div class="text">
                What is backend web development?
                A complete overview. New video is up!
            </div>

            <div class="link">

                <div class="thumbnail"></div>

                <div class="link-info">
                    <div class="website">youtube.com</div>
                    <div class="title">
                        Backend web development -
                        a complete overview (2021)
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
