<!DOCTYPE html>
<html>
<head>
<style>
.email {
    width: 400px;
    border: 1px solid #ddd;
    padding: 15px;
}

.title {
    color: gray;
    font-size: 12px;
    margin-bottom: 15px;
}

.message {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
}

.profile {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    margin-right: 10px;
}

.content {
    flex: 1;
}

.sender {
    font-weight: bold;
}

.subject {
    font-weight: bold;
}

.preview {
    color: gray;
}

.time {
    font-size: 12px;
    color: gray;
    align-self: flex-start;
}
</style>
</head>

<body>

<div class="email">

    <div class="title">ALL INBOXES</div>

    <div class="message">
        <img class="profile" src="cat.jpg">

        <div class="content">
            <div class="sender">Chewy Promotions</div>
            <div class="subject">Biggest sales of the year!</div>
            <div class="preview">Hey there! We're writing to tell you about our...</div>
        </div>

        <div class="time">4:58 PM</div>
    </div>

    <div class="message">
        <img class="profile" src="dog.jpg">

        <div class="content">
            <div class="sender">Best Buy</div>
            <div class="subject">Your Best Buy eReceipt</div>
            <div class="preview">Thank you for shopping at Best Buy, here is...</div>
        </div>

        <div class="time">12:32 PM</div>
    </div>

    <div class="message">
        <img class="profile" src="cat2.jpg">

        <div class="content">
            <div class="sender">Netflix</div>
            <div class="subject">Here's what's coming soon to Netflix</div>
            <div class="preview">Brand new movies and shows, old favorites...</div>
        </div>

        <div class="time">9:00 AM</div>
    </div>

</div>

</body>
</html>
