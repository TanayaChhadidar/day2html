<!DOCTYPE html>
<html>
<head>
<style>
.tweet {
    border: 1px solid #ddd;
    width: 400px;
    padding: 15px;
    display: flex;
    align-items: center;
}

.profile {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
}

.text {
    flex: 1;
}

.tweet-button {
    background-color: #1da1f2;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
}
</style>
</head>

<body>

<div class="tweet">

    <img class="profile" src="cat.jpg">

    <div class="text">
        What's happening?
    </div>

    <button class="tweet-button">Tweet</button>

</div>

</body>
</html>
