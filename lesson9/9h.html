<!DOCTYPE html>
<html>
<head>
<style>
.google {
    text-align: center;
}

.logo {
    width: 250px;
}

.search {
    width: 500px;
    padding: 12px 20px;
    border-radius: 25px;
    border: 1px solid #ccc;
    margin-top: 20px;
}

button {
    padding: 10px 18px;
    border: none;
    margin: 20px 5px;
}
</style>
</head>

<body>

<div class="google">

    <div>
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">
    </div>

    <div>
        <input class="search" type="text" placeholder="Search Google or type a URL">
    </div>

    <div>
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
    </div>

</div>

</body>
</html>
