<!DOCTYPE html>
<html>
<head>
<style>
.card {
    width: 180px;
    border: 1px solid #ddd;
    padding: 10px;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.name {
    font-weight: bold;
    margin-top: 8px;
}

.friends {
    color: gray;
    font-size: 13px;
}

.add {
    background-color: #4285f4;
    color: white;
    border: none;
    padding: 8px 12px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="card">
    <img src="cat.jpg">

    <div class="name">Oliver</div>

    <div class="friends">2 mutual friends</div>

    <button class="add">Add Friend</button>
</div>

</body>
</html>
