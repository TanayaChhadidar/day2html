<!DOCTYPE html>
<html>
<head>
    <title>7g - Twitter Text Box</title>

    <style>
        .tweet-box {
            width: 600px;
            height: 70px;
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .tweet-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
        }

        .tweet-button {
            background-color: #1d9bf0;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="tweet-box">

        <img class="profile"
             src="https://placecats.com/100/100"
             alt="Profile">

        <input
            class="tweet-input"
            type="text"
            placeholder="What's happening?">

        <button class="tweet-button">
            Tweet
        </button>

    </div>

</body>
</html>
