<!DOCTYPE html>
<html>
<head>
    <title>7f - LinkedIn Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .signup {
            width: 450px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 38px;
            box-sizing: border-box;
            border: 1px solid #777777;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .privacy {
            font-size: 14px;
            color: #555555;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            height: 50px;
            background-color: #2867c7;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="signup">

        <label>Email</label>

        <input type="email">

        <p class="privacy">
            By clicking Agree & Join, you agree to the Privacy Policy.
        </p>

        <button>Agree & Join</button>

    </div>

</body>
</html>
