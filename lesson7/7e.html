<!DOCTYPE html>
<html>
<head>
    <title>7e - Shadow Textbox</title>

    <style>
        input {
            width: 600px;
            height: 40px;
            padding-left: 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;

            outline: none;
        }

    <input type="text" placeholder="Search Google or type a URL">
