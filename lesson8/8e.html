<!DOCTYPE html>
<html>
<head>
    <style>
        .title {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .location {
            display: block;
            width: 500px;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f0f0f0;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .request {
            margin-top: 30px;
            padding: 15px 25px;
            background-color: black;
            color: white;
            border: none;
            font-size: 16px;
        }

        .schedule {
            margin-left: 20px;
            padding: 15px 25px;
            background-color: #f0f0f0;
            color: black;
            border: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="title">Request a ride now</div>

    <input class="location"
           type="text"
           placeholder="Enter pickup location">

    <input class="location"
           type="text"
           placeholder="Enter destination">

    <button class="request">Request now</button>

    <button class="schedule">Schedule for later</button>

</body>
</html>
