<!DOCTYPE html>
<html>
<head>
    <style>
        .name {
            width: 180px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-right: 5px;
            box-sizing: border-box;
        }

        .email {
            display: block;
            width: 370px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .signup {
            display: block;
            width: 370px;
            padding: 12px;
            margin-top: 10px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <input class="name" type="text" placeholder="First name">
    <input class="name" type="text" placeholder="First name">

    <input class="email" type="email" placeholder="Email">

    <button class="signup">Sign Up</button>

</body>
</html>
