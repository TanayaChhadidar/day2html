<!DOCTYPE html>
<html>
<head>
    <title>Buttons</title>

    <style>
        .subscriber-button {
            background-color: red;
            color: white;
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 200px;
            padding: 200px;
        }

        .join-button {
            background-color: white;
            border: 1px solid rgb(41, 56, 78);
            color: rgb(41, 118, 211);
            height: 36px;
            width: 62px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }

        .tweet-button {
            background-color: rgb(41, 118, 211);
            color: white;
            border: none;
            border-radius: 40px;
            width: 200px;
            height: 50px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button class="subscriber-button">
        SUBSCRIBE
    </button>

    <button class="join-button">
        JOIN
    </button>

    <button class="tweet-button">
        Tweet
    </button>

</body>
</html>
