<!DOCTYPE html>
<html>
<head>
<style>
body {
    height: 3000px;
    margin: 0;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    box-shadow: 0 1px 5px gray;
}

.left {
    display: flex;
    align-items: center;
}

.profile {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    padding: 8px 15px;
    border: none;
    background-color: #4285f4;
    color: white;
}
</style>
</head>

<body>

<div class="header">

    <div class="left">
        <img class="profile" src="cat.jpg">
        <b>Oliver Cat</b>
    </div>

    <div class="buttons">
        <button>Add Friend</button>
        <button>Message</button>
    </div>

</div>

</body>
</html>
