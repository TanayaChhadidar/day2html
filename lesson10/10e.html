<!DOCTYPE html>
<html>
<head>
<style>
.card {
    width: 150px;
    border: 1px solid #ddd;
    display: inline-block;
    vertical-align: top;
    margin-right: 10px;
}

.card img {
    width: 150px;
    height: 130px;
    object-fit: cover;
}

.info {
    padding: 8px;
}

.name {
    font-weight: bold;
}

.friends {
    color: gray;
    font-size: 12px;
}

button {
    background-color: #4285f4;
    color: white;
    border: none;
    padding: 7px 10px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="card">
    <img src="cat.jpg">

    <div class="info">
        <div class="name">Oliver</div>
        <div class="friends">2 mutual friends</div>
        <button>Add Friend</button>
    </div>
</div>

<div class="card">
    <img src="cat2.jpg">

    <div class="info">
        <div class="name">Mimi</div>
        <div class="friends">3 mutual friends</div>
        <button>Add Friend</button>
    </div>
</div>

<div class="card">
    <img src="dog.jpg">

    <div class="info">
        <div class="name">Rex</div>
        <div class="friends">4 mutual friends</div>
        <button>Add Friend</button>
    </div>
</div>

</body>
</html>
