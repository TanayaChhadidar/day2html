<!DOCTYPE html>
<html>
<head>
<style>
.container {
    width: 250px;
    border: 1px solid #ddd;
    padding: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    margin: 10px;
}

.number {
    background-color: #4285f4;
    color: white;
    border-radius: 15px;
    padding: 3px 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="row">
        <span>Home</span>
        <span class="number">14</span>
    </div>

    <div class="row">
        <span>Notifications</span>
        <span class="number">3</span>
    </div>

    <div class="row">
        <span>Messages</span>
        <span class="number">5</span>
    </div>

</div>

</body>
</html>
