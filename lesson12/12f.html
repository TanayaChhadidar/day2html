<!DOCTYPE html>
<html>
<head>
<style>
.navbar {
    background-color: #7351b5;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 10px;
}

.home {
    color: white;
    width: 100px;
}

.search {
    flex: 1;
    height: 25px;
    border-radius: 20px;
    border: none;
    padding-left: 15px;
}

.download {
    color: white;
    background-color: #7351b5;
    border: 1px solid white;
    padding: 5px 10px;
    margin-left: 10px;
}
</style>
</head>

<body>

<div class="navbar">

    <div class="home">Home</div>

    <input class="search" type="text" placeholder="Search">

    <button class="download">Download</button>

</div>

</body>
</html>
